name: Build BETAFPVG473

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout led-aux8
        uses: actions/checkout@v4
        with:
          ref: led-aux8
          submodules: recursive

      - name: Install ARM toolchain
        run: make arm_sdk_install
      - name: Clone Betaflight config
        run: make configs

      - name: Build BETAFPVG473
        run: make CONFIG=BEFH/BETAFPVG473

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: BETAFPVG473-led-aux8
          path: obj/*.hex
